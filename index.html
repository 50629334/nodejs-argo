```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future Tech</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Segoe UI","PingFang SC",sans-serif;
    background:#050816;
    color:#fff;
    overflow-x:hidden;
}

/* 背景光效 */
body::before{
    content:"";
    position:fixed;
    width:600px;
    height:600px;
    background:radial-gradient(circle,#00d4ff40,transparent 70%);
    top:-200px;
    right:-150px;
    z-index:-1;
}

body::after{
    content:"";
    position:fixed;
    width:500px;
    height:500px;
    background:radial-gradient(circle,#7c3aed40,transparent 70%);
    bottom:-150px;
    left:-100px;
    z-index:-1;
}

/* 顶部导航 */
.nav{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:24px 8%;
    backdrop-filter:blur(10px);
}

.logo{
    font-size:24px;
    font-weight:700;
    letter-spacing:2px;
    color:#00d4ff;
}

.menu{
    display:flex;
    gap:30px;
}

.menu a{
    color:#ddd;
    text-decoration:none;
    transition:.3s;
}

.menu a:hover{
    color:#00d4ff;
}

/* Hero */
.hero{
    min-height:85vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    flex-direction:column;
    padding:20px;
}

.hero h1{
    font-size:clamp(42px,8vw,88px);
    font-weight:800;
    line-height:1.1;
    background:linear-gradient(90deg,#00d4ff,#8b5cf6);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.hero p{
    max-width:700px;
    margin-top:24px;
    font-size:18px;
    color:#b6bdd1;
    line-height:1.8;
}

.buttons{
    margin-top:40px;
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.btn{
    padding:14px 32px;
    border-radius:12px;
    text-decoration:none;
    transition:.3s;
}

.primary{
    background:linear-gradient(135deg,#00d4ff,#7c3aed);
    color:#fff;
}

.secondary{
    border:1px solid rgba(255,255,255,.15);
    color:#fff;
    backdrop-filter:blur(10px);
}

.btn:hover{
    transform:translateY(-3px);
}

/* 功能区 */
.features{
    padding:80px 8%;
}

.section-title{
    text-align:center;
    font-size:38px;
    margin-bottom:50px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:25px;
}

.card{
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    padding:30px;
    backdrop-filter:blur(12px);
    transition:.3s;
}

.card:hover{
    transform:translateY(-6px);
    border-color:#00d4ff;
}

.card h3{
    margin-bottom:15px;
    color:#00d4ff;
}

.card p{
    color:#aab3c5;
    line-height:1.8;
}

/* 页脚 */
.footer{
    text-align:center;
    padding:40px 20px;
    color:#7c859c;
    border-top:1px solid rgba(255,255,255,.08);
}
</style>
</head>

<body>

<nav class="nav">
    <div class="logo">FUTURE</div>
    <div class="menu">
        <a href="#">首页</a>
        <a href="#">产品</a>
        <a href="#">方案</a>
        <a href="#">联系</a>
    </div>
</nav>

<section class="hero">
    <h1>构建未来数字世界</h1>
    <p>
        简洁设计 · 智能驱动 · 科技美学
        专注于现代化数字产品与创新解决方案，
        让技术与体验完美融合。
    </p>

    <div class="buttons">
        <a href="#" class="btn primary">立即体验</a>
        <a href="#" class="btn secondary">了解更多</a>
    </div>
</section>

<section class="features">
    <h2 class="section-title">核心能力</h2>

    <div class="grid">

        <div class="card">
            <h3>AI 智能</h3>
            <p>结合人工智能与自动化能力，提升业务效率与用户体验。</p>
        </div>

        <div class="card">
            <h3>云端架构</h3>
            <p>高性能、高可用、可弹性扩展的现代化基础设施。</p>
        </div>

        <div class="card">
            <h3>数据驱动</h3>
            <p>通过实时分析与可视化洞察帮助企业快速决策。</p>
        </div>

    </div>
</section>

<footer class="footer">
    © 2026 Future Tech. All Rights Reserved.
</footer>

</body>
</html>
```
